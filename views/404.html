<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f4;
      }

      .container {
        text-align: center;
      }

      h1 {
        font-size: 120px;
        color: #333;
      }

      p {
        font-size: 20px;
        margin-top: 10px;
        color: #666;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
        background-color: #333;
        color: white;
        padding: 12px 24px;
        border-radius: 6px;
        transition: 0.3s;
      }

      a:hover {
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>404 </h1>
      <p>Page Not Found</p>

      <a href="/">Go Back Home</a>
    </div>
  </body>
</html>
