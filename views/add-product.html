<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #f4f6f9;
        color: #333;
      }

      header {
        background-color: #111827;
        padding: 1rem 2rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      nav {
        display: flex;
        gap: 1rem;
      }

      nav li {
        list-style: none;
      }

      nav a {
        text-decoration: none;
        color: white;
        padding: 10px 16px;
        border-radius: 6px;
        transition: background-color 0.3s;
      }

      nav a:hover {
        background-color: #374151;
      }

      main {
        height: calc(100vh - 80px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      form {
        background-color: white;
        width: 100%;
        max-width: 450px;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);

        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #111827;
      }

      input {
        padding: 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.3s;
      }

      input:focus {
        border-color: #2563eb;
      }

      button {
        padding: 14px;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: opacity 0.3s;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <header>
      <nav>
        <li><a href="/">Shop</a></li>
        <li><a href="/admin/add-product">Add Product</a></li>
      </nav>
    </header>

    <main>
      <form action="/admin/add-product" method="POST">
        <h1>Add Product</h1>

        <input
          type="text"
          name="title"
          placeholder="Product Title"
        />

        <button type="submit">Add Product</button>
      </form>
    </main>
  </body>
</html>
